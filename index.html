<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi primera página web</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #111827;
            color: white;
            text-align: center;
        }

        header {
            background: #2563eb;
            padding: 40px 20px;
        }

        h1 {
            font-size: 40px;
        }

        main {
            padding: 50px 20px;
        }

        button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 15px 25px;
            border-radius: 8px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <header>
        <h1>¡Bienvenidos a mi página!</h1>
        <p>Mi primera página creada con GitHub</p>
    </header>

    <main>
        <h2>Sobre nosotros</h2>
        <p>Esta es mi primera página web.</p>
        <button onclick="alert('¡Hola! Gracias por visitarnos')">
            Haz clic aquí
        </button>
    </main>

</body>
</html>
